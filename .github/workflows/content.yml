name: Content

# Every article seed must be content/<lang>/<key>.json in the shape setup
# accepts (see bin/check-content.py); anything else fails the check.

on:
  pull_request:
    paths:
      - 'content/**'
      - 'bin/check-content.py'
      - '.github/workflows/content.yml'
  push:
    branches: [main]
    paths:
      - 'content/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the article seeds
        run: python bin/check-content.py
