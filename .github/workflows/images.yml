name: Images

# Fetches any Commons image named in bin/commons-images.json that is not yet
# in images/commons/, checking its licence through the Commons API, and
# commits the WebP files and inc/data/images.json back to the branch.
# upload.wikimedia.org rate-limits busy addresses; a file it refuses is
# simply tried again on the next run.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    # A pull request from a fork can neither check out its branch here nor
    # push to it with this repository's token, so it is skipped.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow with WebP support
        run: |
          python -m pip install 'pillow>=11.3'
          python -c "from PIL import features; assert features.check('webp')"

      - name: Fetch Commons images
        run: python bin/fetch-commons-images.py || echo "Some Commons images are still pending; they will be tried again on the next run."

      - name: Check sizes
        run: |
          big=$(find images/commons -name '*.webp' -size +200k)
          if [ -n "$big" ]; then echo "Over 200 KB: $big"; exit 1; fi

      - name: Commit changes
        run: |
          if [ -n "$(git status --porcelain images/commons inc/data/images.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add images/commons inc/data/images.json
            git commit -m "Images: run fetch-commons-images"
            git push
          fi
